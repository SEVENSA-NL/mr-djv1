name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    name: Formatting and Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Validate workflow dependency contracts
        run: node scripts/check-workflow-lock-contract.mjs

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install component dependencies
        run: pnpm --dir mr-dj-eds-components --ignore-workspace install --frozen-lockfile

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Typecheck frontend
        run: npm run typecheck
        working-directory: frontend

      - name: Lint components
        run: pnpm --dir mr-dj-eds-components --ignore-workspace run lint

      - name: Typecheck components
        run: pnpm --dir mr-dj-eds-components --ignore-workspace run typecheck:components

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Check formatting (Ruff)
        run: ruff format --check .

      - name: Lint Python (Ruff)
        run: ruff check .

  backend:
    name: Backend Tests and Lint
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: backend
    env:
      CI: true
      DATABASE_URL: postgres://example.com/mrdj
      REDIS_URL: redis://localhost:6379
      RENTGUY_API_BASE_URL: https://api.example.com
      RENTGUY_API_KEY: test-api-key
      RENTGUY_WORKSPACE_ID: workspace-1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  frontend:
    name: Frontend Tests and Lint
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: frontend-nextjs
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend-nextjs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test -- --run

      - name: Build
        run: pnpm run build
